{{ define "main" }}
<h1>Publications</h1>

<input id="pub-search" type="search" placeholder="Search…" style="margin:1em 0;padding:.5em;width:100%;max-width:400px;">

<div id="pub-list">
  {{ range .Pages.ByDate.Reverse }}
    {{ partial "pub-card.html" . }}
  {{ end }}
</div>

<script>
  const input = document.getElementById('pub-search');
  input.addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    for (const card of document.querySelectorAll('.pub-card')) {
      card.style.display = card.innerText.toLowerCase().includes(q) ? '' : 'none';
    }
  });
</script>
{{ end }}
